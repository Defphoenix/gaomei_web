# GAOMEI Web — Apache HTTP frontends
#
# *:80  is redirect-only (force HTTPS for public entry).
# *:18080 keeps an optional HTTP debug vhost (IP / tools). Do not treat 18080
# as the public site; prefer https://gomics.icu.
#
# TLS vhost is managed separately (certbot): sites-available/gaomei-web-le-ssl.conf

# -----------------------------------------------------------------------------
# Port 80 — HTTPS redirect only
# -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName gomics.icu
    ServerAlias www.gomics.icu

    # Must be at VirtualHost scope. Directory-scoped RewriteEngine does NOT
    # enable these rules (certbot once appended rules that silently no-oped).
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301,NE]

    ErrorLog ${APACHE_LOG_DIR}/gaomei-web-http-redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/gaomei-web-http-redirect-access.log combined
</VirtualHost>

# Raw IP on :80 has no Let's Encrypt name; send clients to the canonical host.
<VirtualHost *:80>
    ServerName 118.25.149.190

    RewriteEngine On
    RewriteRule ^ https://gomics.icu%{REQUEST_URI} [L,R=301,NE]

    ErrorLog ${APACHE_LOG_DIR}/gaomei-web-http-redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/gaomei-web-http-redirect-access.log combined
</VirtualHost>

# -----------------------------------------------------------------------------
# Port 18080 — optional HTTP debug (full app). Not the public primary entry.
# -----------------------------------------------------------------------------
<VirtualHost *:18080>
    ServerName gomics.icu
    ServerAlias www.gomics.icu 118.25.149.190
    DocumentRoot /var/www/gaomei_web

    ProxyPreserveHost On
    ProxyPass /admin http://127.0.0.1:18081/admin
    ProxyPassReverse /admin http://127.0.0.1:18081/admin
    ProxyPass /api http://127.0.0.1:18081/api
    ProxyPassReverse /api http://127.0.0.1:18081/api

    Alias /media/ /var/lib/gaomei_web/media/
    <Directory /var/lib/gaomei_web/media>
        Require all granted
        Options -Indexes
    </Directory>

    Alias /static/ /var/lib/gaomei_web/static/
    <Directory /var/lib/gaomei_web/static>
        Require all granted
        Options -Indexes
    </Directory>

    <Directory /var/www/gaomei_web>
        Require all granted
        Options -Indexes
        AllowOverride None
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gaomei-web-error.log
    CustomLog ${APACHE_LOG_DIR}/gaomei-web-access.log combined
</VirtualHost>
