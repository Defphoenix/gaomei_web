<VirtualHost *:80 *:18080>
    ServerName gomics.icu
    ServerAlias www.gomics.icu 118.25.149.190
    DocumentRoot /var/www/gaomei_web

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:18081/api
    ProxyPassReverse /api http://127.0.0.1:18081/api

    Alias /media/ /var/lib/gaomei_web/media/
    <Directory /var/lib/gaomei_web/media>
        Require all granted
        Options -Indexes
    </Directory>

    Alias /static/ /var/lib/gaomei_web/static/
    <Directory /var/lib/gaomei_web/static>
        Require all granted
        Options -Indexes
    </Directory>

    <Directory /var/www/gaomei_web>
        Require all granted
        Options -Indexes
        AllowOverride None
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gaomei-web-error.log
    CustomLog ${APACHE_LOG_DIR}/gaomei-web-access.log combined
</VirtualHost>
